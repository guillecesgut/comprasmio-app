services:
  - type: web
    name: comprasmio
    env: node
    plan: free
    # Corre desde la raíz del repo: compila el panel de administración (web/) y
    # después instala el servidor, que sirve el panel en la raíz y la API en /api.
    # Con NODE_ENV=production npm omite las devDependencies; el panel las necesita para
    # compilar (TypeScript, Vite), por eso --include=dev.
    buildCommand: cd web && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    startCommand: node server/src/index.js
    healthCheckPath: /api/config
    # La app (Expo) y el handoff de diseño no se despliegan acá: un cambio solo
    # en esas carpetas no redespliega el servicio. La app se publica aparte con
    # `eas update`.
    buildFilter:
      ignoredPaths:
        - mobile/**
        - design/**
    envVars:
      - key: NODE_ENV
        value: production
      # Los datos viven en PostgreSQL: sobreviven a los redeploys (la v1 los
      # guardaba en memoria y se perdían).
      - key: DATABASE_URL
        fromDatabase:
          name: comprasmio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_SIGNING_SECRET
        generateValue: true
      # URL pública del servicio, p. ej. https://comprasmio.onrender.com
      - key: PUBLIC_URL
        sync: false
      # Primera cuenta del panel: se crea al arrancar si no existe.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Archivos (fotos, comprobantes, QR) en un bucket compatible con S3
      # (Cloudflare R2). El plan gratuito de Render no tiene disco persistente.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      # Video en vivo (opcional). Sin estos tres, la sala muestra el bloque de
      # color en lugar de la cámara.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

databases:
  - name: comprasmio-db
    plan: free
    databaseName: comprasmio
    user: comprasmio
