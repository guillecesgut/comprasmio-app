services:
  - type: web
    name: comprasmio
    env: node
    plan: free
    # Corre desde la raíz del repo: compila la web y después instala el servidor.
    buildCommand: cd web && npm install && npm run build && cd ../server && npm install
    startCommand: node server/src/index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Video en vivo (opcional). Sin estos tres, la plataforma funciona igual
      # y la sala muestra el bloque de color en lugar de la cámara.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Cuentas de arranque (opcional). El plan gratuito no tiene disco
      # persistente ni Shell: sin esto, cada redeploy deja la base vacía y no
      # hay forma de sembrarla a mano. Completá estas seis para que el
      # servidor arme las dos cuentas solo, cada vez que arranca con la base
      # vacía. Dejalas en blanco si preferís que arranque realmente vacía.
      - key: SEED_SELLER_PHONE
        sync: false
      - key: SEED_SELLER_PASSWORD
        sync: false
      - key: SEED_SELLER_NAME
        sync: false
      - key: SEED_BUYER_PHONE
        sync: false
      - key: SEED_BUYER_PASSWORD
        sync: false
      - key: SEED_BUYER_NAME
        sync: false
