services:
  - type: web
    name: comprasmio
    env: node
    plan: free
    # Corre desde la raíz del repo: compila la web y después instala el servidor.
    buildCommand: cd web && npm install && npm run build && cd ../server && npm install
    startCommand: node server/src/index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Video en vivo (opcional). Sin estos tres, la plataforma funciona igual
      # y la sala muestra el bloque de color en lugar de la cámara.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
